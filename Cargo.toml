[package]
name = "rakku"
version = "0.3.0"
edition = "2021"
description = "Effortless Linux setup, lifecycle management, and local monitoring for self-hosted CI runners: GitHub Actions, GitLab Runner, and Gitea Actions (by fukulabs.dev)"
homepage = "https://fukulabs.dev"
repository = "https://github.com/myzskdev/rakku"
license = "MIT"
readme = "README.md"
keywords = ["github-actions", "gitlab-runner", "gitea", "ci", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dialoguer = "0.11"
flate2 = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
